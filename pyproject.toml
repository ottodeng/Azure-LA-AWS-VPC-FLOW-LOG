[project]
name = "azure-la-aws-vpc-flow-mcp"
version = "0.2.0"
description = "Enterprise MCP server and OpenClaw skill for Azure AWSVPCFlow analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "azure-identity==1.25.3",
  "mcp==2.0.0",
]

[project.scripts]
aws-vpc-flow-mcp = "aws_vpc_flow_mcp.server:main"
aws-vpc-flow-preflight = "aws_vpc_flow_mcp.preflight:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_vpc_flow_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
